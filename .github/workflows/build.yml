name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk BibliaViva.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BibliaViva-apk
          path: BibliaViva.apk
      - name: Publicar versión para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Biblia Viva 1.0.${{ github.run_number }}
          body: Descargá BibliaViva.apk e instalalo en el celular.
          files: BibliaViva.apk
